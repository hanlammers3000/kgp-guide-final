<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice guide: Knowing God Personally</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8e8e4;--ink:#2e2e2e;--mute:#5d5d58;--acc:#f7bf33;--panel:#fff;--line:#cfcfc9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1a;--ink:#ededea;--mute:#a8a8a2;--panel:#262625;--line:#3b3b39}}
:root[data-theme="dark"]{--bg:#1b1b1a;--ink:#ededea;--mute:#a8a8a2;--panel:#262625;--line:#3b3b39}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 "Fira Sans",system-ui,sans-serif}
header{border-bottom:6px solid var(--acc);padding:14px 16px;background:var(--panel)}
h1{margin:0;font-size:1.25rem;font-weight:800;line-height:1.2}
header p{margin:2px 0 0;color:var(--mute);font-size:.9rem}
main{display:grid;gap:20px;max-width:1000px;margin:0 auto;padding:20px 16px 32px;grid-template-columns:minmax(0,1fr)}
@media(min-width:820px){main{grid-template-columns:minmax(0,480px) minmax(0,1fr);align-items:start}}
.stage{perspective:1600px}
.book{container-type:inline-size;position:relative;width:100%;aspect-ratio:672/834;background:#fdfdfb;box-shadow:0 2px 0 var(--line),0 12px 28px rgba(0,0,0,.18);border-radius:2px 8px 8px 2px}
.pg{position:absolute;inset:0;margin:0}
.pg img{width:100%;height:100%;display:block;border-radius:inherit;user-select:none;-webkit-user-drag:none}
.end{display:none;position:absolute;inset:0;flex-direction:column;justify-content:center;gap:12px;padding:8% 9%;background:#fdfdfb;color:#2e2e2e;border-radius:inherit;border-top:22px solid var(--acc);overflow:auto;font-size:clamp(.8rem,2.6vw,.98rem);line-height:1.5}.end h2{margin:0;font-size:1.35em}.end p{margin:0}.end blockquote{margin:0;padding-left:12px;border-left:5px solid #f7bf33;font-weight:600}.end .ref{padding-left:1.6em;text-indent:-1.6em}.end a{color:#1d4ed8;word-break:break-all}.end.in{font-size:clamp(14px,4.2cqw,21px);padding:0;gap:0;border-top:0;justify-content:flex-start;line-height:1.55}
.end.in .band{flex:none;height:5.6%;min-height:26px;background:#f7bf33 repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 2px,transparent 2px 6px);display:flex;align-items:center;justify-content:flex-end;padding:0 7%;font-size:.78em}
.end.in .bd{flex:1;display:flex;flex-direction:column;gap:1em;padding:6% 9% 7%}
.end.in h2{font-size:1.55em;font-weight:800;line-height:1.15}
.end.in h3{margin:0;font-size:1.2em;font-weight:600;line-height:1.3}
.end.in p{color:#3b3b38}.end.in .bt{margin:auto 0}.end.in .em{margin:auto 0;text-align:center;font-weight:800;font-size:1.3em;line-height:1.2;color:#2e2e2e}.end.in .sq{margin:auto 0;padding:0 3%;text-align:center;font-style:italic;font-size:1.25em;line-height:1.5;color:#2e2e2e}
.stmt{display:flex;background:#d9d9d4 repeating-linear-gradient(45deg,rgba(255,255,255,.3) 0 2px,transparent 2px 6px);border-bottom:4px solid #b6b6b0}
.stmt .cr{flex:none;width:clamp(40px,14%,58px);background:#f7bf33}
.stmt b{padding:.7em;font-weight:600;line-height:1.4}.stmt.lt b{font-weight:400}
.cr{position:relative;display:block}
.cr::before,.cr::after{content:"";position:absolute;left:50%;top:50%;background:#2e2e2e}
.cr::before{width:4px;height:22px;margin:-11px 0 0 -2px}
.cr::after{width:16px;height:4px;margin:-6px 0 0 -8px}
.q{margin-top:auto;display:flex;gap:12px;align-items:center;font-style:italic;color:#6e6e69}
.q .cr{flex:none;width:36px;height:36px;background:#f7bf33;border-right:4px solid #c9962a}
.q .cr::before,.q .cr::after{background:#fff}
.leaf{transform-origin:left center;backface-visibility:hidden;display:none;box-shadow:6px 0 18px rgba(0,0,0,.25)}
.mk{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid #fff;background:#0a66ff;color:#fff;box-shadow:0 1px 5px rgba(0,0,0,.45);font:800 14px/1 "Fira Sans",sans-serif;cursor:pointer;padding:0;transition:transform .15s,background .15s}
.mk:hover{transform:scale(1.12)}
.mk[aria-pressed="true"]{background:#0a2e8a;color:#fff;transform:scale(1.2)}.mk:focus-visible{outline:3px solid #ff9f0a}
:focus-visible{outline:3px solid #1d6fe0;outline-offset:2px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.nav button{font:600 1rem "Fira Sans",sans-serif;padding:10px 18px;border-radius:6px;border:2px solid var(--ink);background:var(--acc);color:#2e2e2e;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav span{font-weight:600;color:var(--mute);text-align:center}
.side h2{margin:0 0 4px;font-size:1.1rem}
.side>p{margin:0 0 12px;color:var(--mute);font-size:.92rem}
.acc{border:1px solid var(--line);background:var(--panel);border-radius:6px;margin-bottom:8px;overflow:hidden}
.acc>button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;padding:12px;border:0;background:none;color:var(--ink);font:600 1rem "Fira Sans",sans-serif;cursor:pointer}
.acc .n{flex:none;width:26px;height:26px;border-radius:50%;background:#0a66ff;color:#fff;display:grid;place-items:center;font-weight:800;font-size:.85rem}
.acc .c{flex:none;margin-left:auto;transition:transform .2s}
.acc.open .c{transform:rotate(180deg)}
.acc.open{border-color:#0a66ff;box-shadow:inset 4px 0 0 #0a66ff}
.acc .b{display:none;padding:0 14px 14px 48px;margin:0;line-height:1.55}
.acc.open .b{display:block}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const T=[
[[750,140,"Introduce the Four Sections","Explain that the entire booklet has four main points. Share how the first section is all about God’s love for everyone.<br><br>Read the text out loud. Be sure to emphasize how God shows us his love through the plans he has for us. This will help you connect the main point with John 17:3 as you continue reading this page."],
[735,385,"God’s Love","Try reading John 3:16 out loud yourself. Those who grew up attending church may already be familiar with this verse. Ask them if they’ve ever heard it before. If they haven’t, reassure them that that is perfectly fine.<br><br>Share how this verse demonstrates God’s love for every person. Connect it with his actions of: “[giving] his one and only Son.” Connecting God’s love with his actions helps with the transition to the next verse that expands on how God shows his love."],
[735,565,"God’s Plan","Try asking students if they want to read John 17:3 themself. Share how this verse confirms that God has a plan for us: “to know him. And have eternal life.” Share that God’s plan for us is to have a genuine relationship with him."],
[150,890,"The Question","Ask the student this question. Actively listen to their response. Don’t rush them. Consider how their answer connects (or doesn’t connect) with the points on the following page.<br><br>You could try sharing how you might answer this question yourself if they were asking you the same question. Or, you can explain how the second section answers this question for us. Think of this question as your transition into the next section."]],
[[750,140,"Introducing Sin","Read through this portion yourself. Make sure to connect it to the previous question on page 1 of the manual. Explain how it’s because of sin that people are initially unable to have a relationship with God.<br><br>Ask students if they’ve ever heard the word sin before. Do they know what it means? If they do, ask them how they’d define sin. If they don’t know, reassure them that the paragraph below explains it in detail."],
[735,350,"People Are Sinful","You can skip reading this verse and go straight to the paragraph below. Or, you can read this scripture together. Oftentimes, sharing this verse can be helpful for students who’ve felt judged for their choices.<br><br>Help them see that it is not just some who sin but all. No one is better or worse than any one else. Be sure to include yourself in this."],
[735,480,"The Description of Sin","Ask students to read through the description of sin. After reading, ask them if it makes sense or if they have any questions. Be sure to listen actively. This can be a very heavy topic for some. Don’t push students to share anything they don’t feel comfortable sharing.<br><br>Instead, feel free to share your own experiences in learning the definition of sin. How did it make you feel? Oftentimes, there are many misconceptions about what it actually means. If you’ve experienced that then this could be a good time to share. Vulnerability can go a long way in helping others be vulnerable themselves."],
[735,745,"People Are Separated","Connect this portion with the initial concept from page one: this is why people can’t, initially, have a relationship with God. Sin is what separates people from God. Share how the next page explains this more."]],
[[293,363,"The Diagram","Point to the graphic as you read the paragraph next to it. Help students understand how everyone has their own way of trying to “reach” God.<br><br>Consider sharing ways you tried to “reach” God in your efforts. Remember, your own vulnerability can help others be vulnerable as well."],
[735,240,"The Paragraph","If you want, you can ask students why they think people try to reach God in their own efforts. Again, be sure to share your own answer. Why did you try to reach God in your own efforts?<br><br>Take this as an opportunity to transition into the next page. The next page explains how God reaches us."],
[735,765,"The Question","End this portion on a note of hope. Explain how God didn’t leave us without hope of reaching Him.<br><br>Consider asking the student if they know what God did to reach humanity. If they don’t know, share how the next page will explain it for them."]],
[[731,263,"God’s Provision","Frame this as the answer to how we can have a relationship with Him. We can’t reach God in our own efforts. God reaches down to us."],
[735,340,"He Died in Our Place","Connect this verse to the very first section of the booklet: God loves us. He demonstrates his love through action."],
[735,485,"He Rose From the Dead","You can either read or skip this verse. It may be valuable to read if your student wrestles with whether Jesus existed or not."],
[735,710,"He Is the Only Way","Be sure to reiterate that Jesus claims to be the only way to reach God. Ask them to consider why that is.<br><br>Oftentimes, students struggle with this concept. Many view religion and spiritual matters as something that becomes true depending on the person and what they need or think is right. Ask them to consider what makes things true and what does not. Try to think through how you might answer that question yourself.<br><br>There are a number of different ways to go about the topic. One way that keeps the conversation grounded in the topics in the booklet is to ask students to consider the inevitably of physical death. You can share how what we believe to be true about our death doesn’t dictate whether it happens or not."]],
[[377,515,"The Diagram","When showing this diagram, have students flip back to page 3 with the original diagram without Jesus. Ask students how both diagrams differ."],
[735,790,"The Next Step","It is important to emphasize that it isn’t enough to simply know that Jesus died on the cross. This can be connected to the idea that knowing facts about someone is not the same as having a real, genuine relationship."]],
[[731,263,"Receive Christ Individually","Stress the importance of each person individually accepting Christ for themselves. You can connect this to Romans 3:23: “All have sinned and fall short of the glory of God.” This is the same verse you read on page 2 of the booklet. Use this verse to help students understand why we each must individually receive Christ.<br><br>A relationship with God is not something a person inherits but rather something a person can receive if they so choose.<br><br>This can help students better understand the reason salvation from God requires an active response/action.<br><br>You can also stress how God doesn’t force anyone into a relationship with him."],
[735,330,"What Does “Receive” Mean?","Have students read this verse. Ask them if they know what it means to “receive” God.<br><br>Explain to them how receiving Christ means to believe in him. This is an active step. You can try using an analogy here. To trust in something one must make an active step.<br><br>For example, a person proves their trust in a bridge and its stability by taking a step onto the bridge. Similarly, if a person trusts God they will believe what he says. Those who believe what a person says prove it by following their words."],
[735,730,"A New Birth","This verse discusses what it means to be born again. If you have time, you can both read this scripture together. Be sure to emphasize how we’re only born again if we receive Christ into our life as John 1:12 explains."]],
[[735,192,"Personal Invitation","Tie this verse back to the concept of free will. Show students that God pursues humanity but that humanity can choose whether to live for him or not. He does not force a relationship with anyone."],
[711,601,"What Receiving Means","Ask students if they have ever heard someone explain salvation from God this way before. Does it make sense? What’s confusing about it?<br><br>You can also ask students what they think it means to receive Christ before reading the description. Is this new to them? Or familiar?<br><br>Feel free to share how you first came to terms with this concept. Was it relieving? Scary? Or something else? Be sure to listen. Don’t rush."],
[735,665,"The Two Circles","There are different ways to explain this portion. Traditionally, people describe the diagram as circles representing a person’s life. The “S” symbolizes “self” and the chair represents the “throne” of a person’s life. The cross represents Christ and who is and whether he is on the throne of a person’s life or not.<br><br>Another way to illustrate this concept is by describing the throne of a person’s life as the “drivers seat” of their car/life. Who is in charge? Who has their hands on the wheel telling us what to do? Is it Christ? Or ourselves?<br><br>In either illustration, people have a choice in who they want in control of their life. When a person receives Christ they are, essentially, placing God on the throne or in the driver’s seat of their life.<br><br>Again, you can connect this to active steps. Trust involves taking an active step. In this case, an active step is physically taking your hands off the driver’s wheel."],
[451,884,"Who’s on the Throne?","Directly ask students who are in control of their life. Do they want to be in control? Or do they want God in control? Who do they trust more?<br><br>No matter their answer, you can transition to the next page by sharing that the next page shows what it looks like to say yes to Christ."]],
[[735,190,"It’s About the Heart","Reassure students that it isn’t about using the right words in order to receive Christ. It all comes down to a person’s motives. Do they believe God at his word enough to actually choose God’s way or their own?<br><br>To pray a prayer like this is to say: “God, I trust you enough to put you in control of my life. Please, come into my life.”"],
[735,430,"The Suggested Prayer","Share this example prayer as just that: an example. If students do want to give their lives to Christ, offer them the option of either doing so right then and there or asking them to consider it privately."],
[735,715,"Closing the Conversation","This is where you can ask the student what they think. Do they have any lingering questions? Have they ever heard a message like this before? Remember to thank them for their time."]],
[]

const INTRO=[
BD(`<h2>Welcome</h2><p>If you’ve been involved with Cru for very long, you might have heard this saying:</p>`+`<p class="sq">“In evangelism, we are to step out in faith in the power of the Holy Spirit and leave the results to God.”</p>`+`<p style="margin-bottom:2em">But what does that mean? What does it mean to actually “step out” in faith?</p>`),
BD(`<div style="margin:auto 0;display:flex;flex-direction:column;gap:.4em;position:relative;top:-1.2em"><h3>Hebrews 11:1</h3><p class="sq" style="margin:0">“Now faith is confidence in what we hope for and assurance about what we do not see.”</p></div><p style="margin-bottom:2em">To step out in faith is to actively ‘step’ forward into an action with confidence <i>trusting</i> that God will be there and provide for us.</p>`),
BD(ST("For anyone, the idea of reading through the booklet with someone for the first time can feel overwhelming, but this is true of learning anything new.")+`<p style="margin-top:auto">It is a step of faith, but a worthwhile one. It takes time to grow in confidence, but we all have to start somewhere!</p><p style="margin-top:auto">In retrospect, I’ve learned that more than half the battle in learning how to use the KGP is to take that initial faith step in committing to learn in the first place.</p>`),
BD(`<div style="text-align:center"><p style="font-weight:800;font-size:1.15em;line-height:1.3;color:#2e2e2e;margin-bottom:.6em">Don’t feel you need to figure it all out on the first read.</p><p>Consider studying this manual your first step of faith in an ongoing journey of learning. God doesn’t expect perfection and neither should we.</p></div><div style="margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:.5em;text-align:center"><i style="display:block;width:3em;height:4px;background:#f7bf33;margin-bottom:.4em"></i><h3>2 Corinthians 12:9</h3><p class="sq" style="margin:0;font-size:1.05em">“But he said to me, ‘My grace is sufficient for you, for my power is made perfect in weakness.’ Therefore I will boast all the more gladly about my weaknesses, so that Christ’s power may rest on me.”</p></div>`),
BD(`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.6em;font-size:1.1em"><h2>First Steps</h2><p>Read through the instruction manual. Each page has clickable links with tips and tricks on different ways you might read through the booklet with someone interested in learning more about our organization and our values.</p><p>As you read through it, consider which analogies make the most sense to you. How might you explain these concepts to someone who has never heard them before?</p><p><b>Remember, it isn’t about perfection. Practice, learn, and practice some more. 🙂</b> Feel free to ask someone to go with you to continue to learn alongside someone else.</p></div>`)
],NI=INTRO.length,NB=IMGS.length,TOT=NI+NB+2;const SC=[1.25,1.2,1.4,1,1];
const REFS="<h2>References</h2><p class=\"ref\"><i>Knowing God Personally</i>, <a href=\"https://www.cru.org/content/dam/cru/how-to-know-god/knowing-god-personally.pdf\" target=\"_blank\" rel=\"noopener\">www.cru.org/content/dam/cru/how-to-know-god/knowing-god-personally.pdf</a>. Accessed 11 Oct. 2026.</p><p class=\"ref\">“Create an interactive page for students learning a prospective-member booklet” prompt. <i>Claude</i>, Sonnet 5.5 version, Anthropic, 25 Oct. 2026, claude.ai.</p><p style=\"font-size:.85em;opacity:.75\">Booklet page images are from the first source above. Claude created this interactive guide.</p>";
function face(f,i){const e=f.querySelector(".end"),m=f.querySelector("img"),x=i<NI||i>=NI+NB;m.style.display=x?"none":"";e.style.display=x?"flex":"none";e.classList.toggle("in",i<NI||i===NI+NB);if(x){e.innerHTML=i<NI?INTRO[i]:i===NI+NB?END:REFS;const bd=e.querySelector(".bd");if(bd)bd.style.fontSize=(i<NI?SC[i]:1.15)+"em";}else m.src=IMGS[i-NI];}
document.querySelectorAll(".pg").forEach(f=>{const d=document.createElement("div");d.className="end";f.appendChild(d);});
let cur=0,busy=false;
function open(i){[...list.children].forEach((a,j)=>{const o=j===i&&!a.classList.contains("open");a.classList.toggle("open",o);a.firstChild.setAttribute("aria-expanded",o);});
 [...marks.children].forEach((m,j)=>m.setAttribute("aria-pressed",j===i&&list.children[i].classList.contains("open")));}
function render(){
 face(base.parentNode,cur);
 const intro=cur<NI,fin=cur>=NI+NB,pg=cur-NI,off=intro||fin;
 base.alt=off?"":"Booklet page "+(pg+1);
 $("count").textContent=intro?"Welcome "+(cur+1)+" of "+NI:cur===TOT-1?"References":fin?"Closing note":"Page "+(pg+1)+" of "+NB;
 $("prev").disabled=cur===0;$("next").disabled=cur===TOT-1;
 $("next").textContent=cur===NI-1?"Start the booklet":cur===TOT-3?"Closing note":cur===TOT-2?"References":"Next page";
 $("sp").hidden=off;
 $("sh").textContent=intro?"Welcome":cur===TOT-1?"References":fin?"You’ve reached the end":"On this page";
 marks.innerHTML="";list.innerHTML=intro?'<p style="margin:0;color:var(--mute)">Use Next to read the welcome, then page through the booklet. On each booklet page, tap the numbered markers for coaching tips.</p>':"";
 (off?[]:T[pg]).forEach((t,i)=>{
  const m=document.createElement("button");m.className="mk";m.textContent=i+1;m.setAttribute("aria-pressed","false");m.setAttribute("aria-label","Tip "+(i+1)+": "+t[2]);
  m.style.left=((t[0]-X0)/W*100)+"%";m.style.top=((t[1]-Y0)/H*100)+"%";m.onclick=()=>open(i);marks.appendChild(m);
  const a=document.createElement("div");a.className="acc";
  a.innerHTML='<button aria-expanded="false"><span class="n">'+(i+1)+'</span>'+t[2]+'<span class="c" aria-hidden="true">&#9662;</span></button><p class="b">'+t[3]+'</p>';
  a.firstChild.onclick=()=>open(i);list.appendChild(a);
 });
}
function go(d){
 const n=cur+d;if(busy||n<0||n>=TOT)return;
 if(reduce){cur=n;render();return;}
 busy=true;marks.style.visibility="hidden";
 leaf.style.display="block";leaf.style.transition="none";
 if(d>0){face(base.parentNode,n);face(leaf,cur);leaf.style.transform="rotateY(0)";}
 else{face(base.parentNode,cur);face(leaf,n);leaf.style.transform="rotateY(-110deg)";}
 leaf.offsetWidth;
 leaf.style.transition="transform .7s ease-in-out";
 leaf.style.transform=d>0?"rotateY(-110deg)":"rotateY(0)";
 setTimeout(()=>{cur=n;render();leaf.style.display="none";marks.style.visibility="";busy=false;},720);
}
$("next").onclick=()=>go(1);$("prev").onclick=()=>go(-1);
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1);});
render();
</script>
</body>
</html>
